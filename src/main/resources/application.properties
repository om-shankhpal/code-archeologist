# Load local .env file
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=code-archeologist

# Gemini model selection
spring.ai.model.chat=google-genai
spring.ai.model.embedding=google-genai

# Gemini API
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Gemini Chat
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Pinecone
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=code-archeologist

# Server
server.port=8080
# Load local environment variables
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=code-archeologist
server.port=8080

# Enable AI models
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

# Gemini API
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Gemini Chat
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.max-output-tokens=8192

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=768

# Pinecone
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=code-archeologist-vectors

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true